<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kimen Variant 03 | Orbit</title>
    <meta
      name="description"
      content="Orbit concept for Kimen: an interactive vault and projection selector."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=Sora:wght@400;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0b0f18;
        --panel: #101728;
        --line: #253149;
        --text: #edf1f8;
        --muted: #9aa5b6;
        --accent: #e9b14a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Sora", sans-serif;
        color: var(--text);
        background:
          radial-gradient(
            circle at center,
            rgba(233, 177, 74, 0.12),
            transparent 24%
          ),
          var(--bg);
      }

      main {
        width: min(980px, 92vw);
        margin: 0 auto;
        padding: 1.75rem 0 4rem;
      }

      .topline,
      .controls button,
      .definition,
      pre {
        font-family: "IBM Plex Mono", monospace;
      }

      .topline {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        font-size: 0.78rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .topline a {
        color: inherit;
      }

      .stage {
        width: min(100%, 780px);
        margin: 1.5rem auto 0;
      }

      svg {
        display: block;
        width: 100%;
        height: auto;
      }

      .ring,
      .vault,
      .vault-core,
      .target,
      .beam {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .ring,
      .vault {
        stroke: var(--line);
        stroke-width: 3;
      }

      .vault-core,
      .target {
        stroke: var(--accent);
        stroke-width: 3;
      }

      .beam {
        stroke: var(--accent);
        stroke-width: 4;
        opacity: 0.14;
        transition: opacity 180ms ease;
      }

      .target-fill,
      .secret-dot {
        fill: rgba(233, 177, 74, 0.15);
        stroke: var(--accent);
        stroke-width: 3;
      }

      .target-label,
      .vault-label {
        font-family: "IBM Plex Mono", monospace;
        font-size: 18px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        fill: var(--muted);
      }

      .active .beam,
      .beam.active {
        opacity: 1;
      }

      .target-group.active .target-fill {
        fill: rgba(233, 177, 74, 0.34);
      }

      .target-group.active .target {
        filter: drop-shadow(0 0 18px rgba(233, 177, 74, 0.35));
      }

      .secret-dot {
        animation: orbit 4.2s ease-in-out infinite;
      }

      .copy {
        max-width: 40rem;
        margin: 1.25rem auto 0;
        text-align: center;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .definition {
        margin: 0;
        color: var(--muted);
        line-height: 1.7;
      }

      .controls {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 0.7rem;
        margin-top: 1.35rem;
      }

      .controls button {
        padding: 0.7rem 0.95rem;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: transparent;
        color: var(--text);
        font-size: 0.82rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        cursor: pointer;
      }

      .controls button[aria-pressed="true"] {
        border-color: var(--accent);
        color: var(--accent);
      }

      pre {
        width: min(46rem, 100%);
        margin: 1.4rem auto 0;
        padding: 1rem 1.1rem;
        border: 1px solid var(--line);
        border-radius: 1.1rem;
        background: rgba(255, 255, 255, 0.02);
        font-size: 0.86rem;
        line-height: 1.7;
        white-space: pre-wrap;
      }

      @keyframes orbit {
        0%,
        100% {
          transform: translateX(0);
        }

        50% {
          transform: translateX(18px);
        }
      }
    </style>
  </head>
  <body>
    <main data-mode="env">
      <h1 class="sr-only">Kimen</h1>
      <div class="topline">
        <span>Variant 03 / Orbit</span>
        <a href="../index.html">Back to variants</a>
      </div>

      <div class="stage">
        <svg
          viewBox="0 0 780 520"
          role="img"
          aria-label="Interactive vault projection diagram."
        >
          <circle class="ring" cx="300" cy="260" r="190" />
          <circle class="vault" cx="300" cy="260" r="108" />
          <circle class="vault-core" cx="300" cy="260" r="52" />
          <rect
            class="secret-dot"
            x="118"
            y="244"
            width="32"
            height="32"
            rx="16"
          />
          <text class="vault-label" x="244" y="266">Kimen</text>

          <g class="beam-group beam-env">
            <path class="beam active" d="M386 224 Q500 182 620 122" />
          </g>
          <g class="beam-group beam-file">
            <path class="beam" d="M408 260 H640" />
          </g>
          <g class="beam-group beam-child">
            <path class="beam" d="M386 296 Q500 338 620 398" />
          </g>

          <g class="target-group target-env active">
            <circle class="target-fill" cx="646" cy="108" r="44" />
            <circle class="target" cx="646" cy="108" r="44" />
            <path class="target" d="M622 108 H670" />
            <text class="target-label" x="604" y="34">Env</text>
          </g>

          <g class="target-group target-file">
            <circle class="target-fill" cx="670" cy="260" r="44" />
            <circle class="target" cx="670" cy="260" r="44" />
            <path class="target" d="M646 244 H694" />
            <path class="target" d="M646 260 H688" />
            <path class="target" d="M646 276 H680" />
            <text class="target-label" x="626" y="208">File</text>
          </g>

          <g class="target-group target-child">
            <circle class="target-fill" cx="646" cy="412" r="44" />
            <circle class="target" cx="646" cy="412" r="44" />
            <rect
              class="target"
              x="626"
              y="392"
              width="40"
              height="40"
              rx="10"
            />
            <text class="target-label" x="566" y="490">Child process</text>
          </g>
        </svg>
      </div>

      <div class="copy">
        <p class="definition">
          Store a secret in the encrypted local vault. Choose how to project it.
          Start the command that needs it.
        </p>
      </div>

      <div class="controls" aria-label="Projection shapes">
        <button type="button" data-mode="env" aria-pressed="true">
          Env var
        </button>
        <button type="button" data-mode="file" aria-pressed="false">
          File
        </button>
        <button type="button" data-mode="child" aria-pressed="false">
          Child process
        </button>
      </div>

      <pre id="command">
$ kimen run --env OPENAI_API_KEY=assistant_key -- codex</pre
      >
    </main>

    <script>
      const commands = {
        env: "$ kimen run --env OPENAI_API_KEY=assistant_key -- codex",
        file: '$ kimen render --dir "$OUTDIR" --file service-api-token.txt=demo_service_api_token',
        child:
          "$ kimen run --env DATABASE_URL=demo_database_url -- clojure -M:test",
      };

      const root = document.querySelector("main");
      const command = document.getElementById("command");
      const buttons = document.querySelectorAll("[data-mode]");
      const beams = {
        env: document.querySelector(".beam-env .beam"),
        file: document.querySelector(".beam-file .beam"),
        child: document.querySelector(".beam-child .beam"),
      };
      const targets = {
        env: document.querySelector(".target-env"),
        file: document.querySelector(".target-file"),
        child: document.querySelector(".target-child"),
      };

      function setMode(mode) {
        root.dataset.mode = mode;
        command.textContent = commands[mode];

        buttons.forEach((button) => {
          button.setAttribute(
            "aria-pressed",
            String(button.dataset.mode === mode),
          );
        });

        Object.entries(beams).forEach(([key, beam]) => {
          beam.classList.toggle("active", key === mode);
        });

        Object.entries(targets).forEach(([key, target]) => {
          target.classList.toggle("active", key === mode);
        });
      }

      buttons.forEach((button) => {
        button.addEventListener("click", () => setMode(button.dataset.mode));
      });
    </script>
  </body>
</html>
