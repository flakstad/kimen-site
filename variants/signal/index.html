<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kimen Variant 02 | Sheet</title>
    <meta
      name="description"
      content="Sheet concept for Kimen: a paper form filled by the vault, then handed to a simple env-reading app."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=Syne:wght@500;700&amp;display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --paper: #f4efe6;
        --ink: #181513;
        --muted: #5d5650;
        --line: #cdbfaa;
        --accent: #b43825;
        --accent-soft: rgba(180, 56, 37, 0.1);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Syne", sans-serif;
        color: var(--ink);
        background:
          linear-gradient(180deg, rgba(180, 56, 37, 0.04), transparent 18%),
          var(--paper);
      }

      main {
        width: min(1040px, 94vw);
        margin: 0 auto;
        padding: 1.75rem 0 4rem;
      }

      .topline,
      .summary,
      pre,
      .stamp {
        font-family: "IBM Plex Mono", monospace;
      }

      .topline {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        font-size: 0.78rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .topline a {
        color: inherit;
      }

      .stage {
        margin: 1rem 0 0;
      }

      svg {
        display: block;
        width: 100%;
        height: auto;
      }

      .sheet,
      .env-slip,
      .app,
      .stamp-ring,
      .field,
      .field-fill,
      .app-line {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .sheet,
      .env-slip,
      .app {
        stroke: var(--line);
        stroke-width: 4;
      }

      .stamp-ring,
      .field,
      .field-fill,
      .app-line {
        stroke: var(--accent);
        stroke-width: 3;
      }

      .field-fill {
        fill: var(--accent-soft);
      }

      .static-line {
        fill: none;
        stroke: #82776d;
        stroke-width: 3;
        stroke-linecap: round;
      }

      .beam {
        fill: none;
        stroke: var(--accent);
        stroke-width: 4;
        stroke-dasharray: 12 16;
        animation: drift 9s linear infinite;
      }

      .label,
      .field-label {
        font-family: "IBM Plex Mono", monospace;
        text-transform: uppercase;
      }

      .label {
        font-size: 18px;
        letter-spacing: 0.12em;
        fill: var(--muted);
      }

      .field-label {
        font-size: 16px;
        letter-spacing: 0.08em;
        fill: var(--ink);
      }

      .summary {
        max-width: 48rem;
        margin: 1.4rem auto 0;
        font-size: 0.94rem;
        line-height: 1.7;
        text-align: center;
      }

      .stamp {
        display: inline-block;
        margin: 1rem auto 0;
        padding: 0.4rem 0.7rem;
        border: 2px solid var(--accent);
        color: var(--accent);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        transform: rotate(-4deg);
      }

      .stamp-wrap {
        text-align: center;
      }

      pre {
        width: min(30rem, 100%);
        margin: 1.3rem auto 0;
        padding: 1rem 1.1rem;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.38);
        font-size: 0.86rem;
        line-height: 1.7;
        white-space: pre-wrap;
      }

      @keyframes drift {
        from {
          stroke-dashoffset: 0;
        }

        to {
          stroke-dashoffset: -220;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="topline">
        <span>Variant 02 / Sheet</span>
        <a href="../index.html">Back to variants</a>
      </div>

      <figure class="stage">
        <svg
          viewBox="0 0 1040 620"
          role="img"
          aria-label="A config sheet filled by secrets from a vault stamp and passed to an application that reads normal environment variables."
        >
          <text class="label" x="108" y="116">Vault</text>
          <text class="label" x="378" y="90">Config sheet</text>
          <text class="label" x="780" y="450">Env</text>
          <text class="label" x="900" y="450">App</text>

          <circle class="stamp-ring" cx="170" cy="250" r="92" />
          <circle class="stamp-ring" cx="170" cy="250" r="46" />
          <path class="beam" d="M242 232 C304 210 334 190 396 174" />
          <path class="beam" d="M254 250 C318 250 344 250 408 250" />
          <path class="beam" d="M242 268 C304 290 336 314 396 336" />

          <g transform="translate(340 116) rotate(-3 180 170)">
            <rect class="sheet" x="0" y="0" width="360" height="360" rx="26" />
            <text class="field-label" x="34" y="72">App mode</text>
            <path class="static-line" d="M182 64 H298" />
            <text class="field-label" x="34" y="138">Region</text>
            <path class="static-line" d="M144 130 H298" />
            <text class="field-label" x="34" y="204">Api token</text>
            <rect
              class="field-fill"
              x="146"
              y="178"
              width="152"
              height="34"
              rx="17"
            />
            <path class="field" d="M166 195 H274" />
            <text class="field-label" x="34" y="270">Database url</text>
            <rect
              class="field-fill"
              x="176"
              y="244"
              width="122"
              height="34"
              rx="17"
            />
            <path class="field" d="M196 261 H270" />
            <text class="field-label" x="34" y="336">Log format</text>
            <path class="static-line" d="M182 328 H298" />
          </g>

          <g transform="translate(708 330) rotate(4 108 82)">
            <rect
              class="env-slip"
              x="0"
              y="0"
              width="216"
              height="164"
              rx="18"
            />
            <path class="field" d="M28 46 H186" />
            <path class="field" d="M28 78 H174" />
            <path class="field" d="M28 110 H194" />
            <path class="field" d="M28 142 H168" />
          </g>

          <rect class="app" x="876" y="210" width="112" height="116" rx="22" />
          <path class="app-line" d="M906 246 H956" />
          <path class="app-line" d="M906 276 H942" />
        </svg>
      </figure>

      <p class="summary">
        Think of the app config as a mostly static sheet with a few empty
        fields. Kimen fills those fields from the local vault when needed, then
        hands the application a normal environment.
      </p>

      <div class="stamp-wrap">
        <span class="stamp">App stays simple</span>
      </div>

      <pre>apiToken := os.Getenv("API_TOKEN")</pre>
    </main>
  </body>
</html>
