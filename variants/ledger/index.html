<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kimen Variant 01 | Conduit</title>
    <meta
      name="description"
      content="Conduit concept for Kimen: vault to config sheet to env to app."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=Space+Grotesk:wght@400;500;700&amp;display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #070b11;
        --line: #1a2b42;
        --line-soft: rgba(136, 168, 255, 0.22);
        --text: #f3f7fb;
        --muted: #9aaabd;
        --accent: #88a8ff;
        --accent-soft: rgba(136, 168, 255, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Space Grotesk", sans-serif;
        color: var(--text);
        background:
          radial-gradient(
            circle at center,
            rgba(136, 168, 255, 0.12),
            transparent 28%
          ),
          var(--bg);
      }

      main {
        width: min(1180px, 94vw);
        margin: 0 auto;
        padding: 1.75rem 0 4rem;
      }

      .topline,
      .note,
      pre,
      .label {
        font-family: "IBM Plex Mono", monospace;
      }

      .topline {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        font-size: 0.78rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .topline a {
        color: inherit;
      }

      .stage {
        margin: 1rem 0 0;
      }

      svg {
        display: block;
        width: 100%;
        height: auto;
      }

      .frame,
      .sheet,
      .env,
      .app,
      .token,
      .token-mark,
      .sheet-line,
      .env-line,
      .app-line {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .frame,
      .sheet,
      .env,
      .app {
        stroke: var(--line);
        stroke-width: 4;
      }

      .token,
      .token-mark,
      .sheet-line,
      .env-line,
      .app-line {
        stroke: var(--accent);
        stroke-width: 3;
      }

      .token {
        fill: var(--accent-soft);
      }

      .static-line {
        fill: none;
        stroke: #54657c;
        stroke-width: 3;
        stroke-linecap: round;
      }

      .beam-track {
        fill: none;
        stroke: var(--line-soft);
        stroke-width: 10;
      }

      .beam-live {
        fill: none;
        stroke: var(--accent);
        stroke-width: 4;
        stroke-dasharray: 14 16;
        animation: travel 9s linear infinite;
      }

      .fill-dot {
        fill: var(--accent);
        animation: pulse 2.2s ease-in-out infinite;
      }

      .label {
        font-size: 18px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        fill: var(--muted);
      }

      .summary {
        max-width: 50rem;
        margin: 1.4rem auto 0;
        font-size: clamp(1.05rem, 2vw, 1.28rem);
        line-height: 1.55;
        text-align: center;
      }

      .note {
        margin: 1rem 0 0;
        font-size: 0.8rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        text-align: center;
        color: var(--accent);
      }

      pre {
        width: min(28rem, 100%);
        margin: 1.4rem auto 0;
        padding: 1rem 1.1rem;
        border: 1px solid var(--line);
        border-radius: 1rem;
        background: rgba(255, 255, 255, 0.02);
        font-size: 0.86rem;
        line-height: 1.7;
        white-space: pre-wrap;
      }

      @keyframes travel {
        from {
          stroke-dashoffset: 0;
        }

        to {
          stroke-dashoffset: -220;
        }
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 0.4;
          transform: scale(1);
        }

        50% {
          opacity: 1;
          transform: scale(1.35);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="topline">
        <span>Variant 01 / Conduit</span>
        <a href="../index.html">Back to variants</a>
      </div>

      <figure class="stage">
        <svg
          viewBox="0 0 1180 560"
          role="img"
          aria-label="Secrets flowing from a vault into a config sheet, then into standard environment variables for an application."
        >
          <text class="label" x="70" y="96">Vault</text>
          <text class="label" x="388" y="96">Config sheet</text>
          <text class="label" x="808" y="96">Standard env</text>
          <text class="label" x="1020" y="96">App</text>

          <rect class="frame" x="54" y="128" width="220" height="300" rx="28" />
          <rect class="token" x="98" y="182" width="132" height="44" rx="22" />
          <rect class="token" x="98" y="256" width="148" height="44" rx="22" />
          <rect class="token" x="98" y="330" width="120" height="44" rx="22" />
          <path class="token-mark" d="M132 204 H186" />
          <path class="token-mark" d="M132 278 H204" />
          <path class="token-mark" d="M132 352 H176" />

          <rect
            class="sheet"
            x="366"
            y="116"
            width="328"
            height="324"
            rx="24"
          />
          <path class="static-line" d="M416 176 H580" />
          <path class="sheet-line" d="M590 176 H646" />
          <path class="static-line" d="M416 238 H562" />
          <path class="sheet-line" d="M574 238 H644" />
          <path class="static-line" d="M416 300 H532" />
          <path class="sheet-line" d="M544 300 H644" />
          <path class="static-line" d="M416 362 H606" />
          <path class="static-line" d="M416 392 H556" />

          <path class="beam-track" d="M274 204 C320 204 340 176 366 176" />
          <path class="beam-live" d="M274 204 C320 204 340 176 366 176" />
          <circle class="fill-dot" cx="324" cy="192" r="8" />

          <path class="beam-track" d="M274 278 C320 278 340 238 366 238" />
          <path class="beam-live" d="M274 278 C320 278 340 238 366 238" />
          <circle class="fill-dot" cx="330" cy="260" r="8" />

          <path class="beam-track" d="M246 352 C308 352 338 300 366 300" />
          <path class="beam-live" d="M246 352 C308 352 338 300 366 300" />
          <circle class="fill-dot" cx="312" cy="326" r="8" />

          <rect class="env" x="780" y="166" width="180" height="214" rx="22" />
          <path class="env-line" d="M816 214 H918" />
          <path class="env-line" d="M816 252 H930" />
          <path class="env-line" d="M816 290 H904" />
          <path class="env-line" d="M816 328 H944" />

          <path class="beam-track" d="M694 278 H780" />
          <path class="beam-live" d="M694 278 H780" />
          <circle class="fill-dot" cx="734" cy="278" r="8" />

          <rect class="app" x="1000" y="212" width="126" height="122" rx="22" />
          <path class="app-line" d="M1034 252 H1094" />
          <path class="app-line" d="M1034 282 H1080" />

          <path class="beam-track" d="M960 278 H1000" />
          <path class="beam-live" d="M960 278 H1000" />
          <circle class="fill-dot" cx="980" cy="278" r="8" />
        </svg>
      </figure>

      <p class="summary">
        Static config on one side. Secret values from the local vault on the
        other. Kimen assembles the runtime environment, and the application just
        reads normal environment variables.
      </p>

      <p class="note">Config in. Secrets in. Standard env out.</p>

      <pre>const apiToken = process.env.API_TOKEN;</pre>
    </main>
  </body>
</html>
