name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build public site
        run: node scripts/build-site.mjs

      - name: Configure analytics
        env:
          KIMEN_POSTHOG_KEY: ${{ vars.KIMEN_POSTHOG_KEY }}
          KIMEN_POSTHOG_HOST: ${{ vars.KIMEN_POSTHOG_HOST }}
          KIMEN_SITE_OUTPUT_DIR: _site
          KIMEN_REQUIRE_EXTERNAL_CONFIG: "1"
        run: node scripts/configure-site.mjs

      - name: Validate public artifact
        run: ./scripts/check-site.sh _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
