name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Configure private form and analytics
        env:
          KIMEN_FORM_ENDPOINT: ${{ secrets.KIMEN_FORM_ENDPOINT }}
          KIMEN_POSTHOG_KEY: ${{ vars.KIMEN_POSTHOG_KEY }}
          KIMEN_POSTHOG_HOST: ${{ vars.KIMEN_POSTHOG_HOST }}
        run: node scripts/configure-site.mjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
